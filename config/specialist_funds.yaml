# Specialist life-science funds tracked through 13F, 13D/G and Form 4 (H4, H18; docs/modules/ownership_flow.md).
#
# Names are written from memory as the funds are commonly known; the exact 13F filer name and the
# CIK must be resolved on the local machine (EDGAR company search), then `cik` filled in and
# `verified: true` set. Until then every row is `unverified`. The list is a starting panel, not a
# quality ranking: "good" is measured per fund by `signals.fund_flow.fund_skill`, point-in-time,
# from the realized outcomes of its earlier new positions. A panel picked by today's reputation is
# survivorship-biased (funds that failed are not famous), so closed funds stay in with `active: false`.
#
# style:
#   hedge_specialist  long/short biotech fund; its 13F longs may be one leg of a pair
#   long_specialist   long-biased dedicated fund
#   crossover         private plus public rounds; buys in financings, sells after lockups
#   venture           mostly private; public stakes come from IPOs and are sold or distributed later
#   activist          files 13D, pushes sales or liquidations (cash-shell plays)
#   generalist_hc     multi-sector fund with a healthcare team (control group, not specialist)
#
# Third-party panels for cross-checking: BiopharmaWatch tracks about 45 biotech-only funds
# (Baker Bros, Perceptive, RA Capital, OrbiMed, EcoR1, Fairmount among them); Stifel's buyside
# study counts 237 life-science and 158 healthcare-only specialist funds.

funds:
  - {name: Baker Bros. Advisors, style: long_specialist, cik: null, verified: false, active: true}
