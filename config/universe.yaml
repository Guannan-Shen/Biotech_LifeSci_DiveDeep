#              | benchmark (index or ETF)
# archetypes:  see docs/framework/archetypes.md
# snapshot:    market data at a point in time; never treat as current without a refresh.
# thesis_note: the investor's own framing; evidence class own_assumption unless sourced.

snapshot_defaults:
